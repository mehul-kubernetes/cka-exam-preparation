---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: my-deployment
 labels:
     app: my-app
     type: front-end 	
spec:
  replicas: 3
  selector:
     matchLabels:
        type: front-end
  template:
    metadata:   
      labels:
        app: my-app
        type: front-end
    spec: 
      containers: 
      - name: c001
        image: nginx