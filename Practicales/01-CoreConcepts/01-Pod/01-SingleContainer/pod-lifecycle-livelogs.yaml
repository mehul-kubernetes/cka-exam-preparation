apiVersion: v1
kind: Pod
metadata:
  labels:
    run: pod-lifecycle-livelogs
  name: pod-lifecycle-livelogs
spec:
  containers:
  - args:
    - /bin/sh
    - -c
    - i=1; while [ $i -le 100 ]; do echo tick $i; i=$((i+1)); sleep 2; done
    image: busybox
    name: pod-lifecycle-livelogs
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Never
status: {}