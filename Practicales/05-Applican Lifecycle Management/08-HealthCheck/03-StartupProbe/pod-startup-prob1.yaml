---
apiVersion: v1
kind: Pod
metadata:
  name: pod-startup-prob1
spec:
  containers:
    - name: main-app
      image: busybox
      command: ["sh", "-c", "sleep 20; touch /tmp/healthy; sleep 3600"]
      startupProbe:
        exec:
          command: ["cat", "/tmp/healthy"]
        periodSeconds: 5
        failureThreshold: 10