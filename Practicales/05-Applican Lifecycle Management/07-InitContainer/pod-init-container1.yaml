---
apiVersion: v1
kind: Pod
metadata:
  name: pod-init-container1
spec:
  initContainers:
    - name: init-setup
      image: busybox
      command: ["sh", "-c", "echo Starting init work; sleep 20; echo ready-from-init > /work/message.txt; echo Init work completed"]
      volumeMounts:
        - name: workdir
          mountPath: /work

  containers:
    - name: main-app
      image: busybox
      command: ["sh", "-c", "cat /work/message.txt && sleep 3600"]
      volumeMounts:
        - name: workdir
          mountPath: /work

  volumes:
    - name: workdir
      emptyDir: {}
