---
apiVersion: v1
kind: Pod
metadata:
  name: pod-init-container2
spec:
  initContainers:
    - name: init-setup
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'echo "Created by init container" > /work/index.html'
      volumeMounts:
        - name: webapp
          mountPath: /work

  containers:
    - name: main-app
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: webapp
          mountPath: /usr/share/nginx/html

  volumes:
    - name: webapp
      emptyDir: {}
